<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>₊˚ ☾. ⋅勞倫a農場商店⋆.˚ ⭒‧</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --wood-dark:#2B1D14;
    --leather:#4A3728;
    --parchment:#EAD9B4;
    --brass:#C9A227;
    --ember:#B5451D;
    --moss:#5C7346;
    --ink:#1A120B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 40px),
      linear-gradient(180deg, var(--wood-dark), #1c130c);
    color:var(--parchment);
    font-family:'Crimson Pro', serif;
  }

  /* ---------- 頂部招牌 ---------- */
  .shop-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px;
    background:linear-gradient(180deg, var(--leather), #3a2b1f);
    border-bottom:4px solid var(--brass);
    box-shadow:0 6px 14px rgba(0,0,0,0.45);
  }
  .shop-title{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:1px;
    color:var(--brass);
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
  }
  .shop-sub{
    font-size:13px; color:var(--parchment); opacity:0.75; margin-top:4px;
    font-style:italic;
  }
  .gold-counter{
    font-family:'Space Mono', monospace;
    background:var(--ink);
    border:2px solid var(--brass);
    border-radius:8px;
    padding:8px 16px;
    font-size:18px;
    display:flex; align-items:center; gap:8px;
  }

  /* ---------- 分類頁籤（吊牌感） ---------- */
  .tabs{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:16px 28px 0;
  }
  .tab{
    font-family:'Cinzel', serif;
    font-size:14px;
    padding:9px 18px 11px;
    background:var(--leather);
    color:var(--parchment);
    border:2px solid #6b5136;
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    opacity:0.7;
    transition:transform .15s, opacity .15s;
  }
  .tab:hover{ transform:translateY(-2px); opacity:0.9; }
  .tab.active{
    background:var(--brass);
    color:var(--ink);
    border-color:var(--brass);
    opacity:1;
    font-weight:700;
  }

  /* ---------- 貨架 / 商品格 ---------- */
  .shelf{
    padding:22px 28px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:18px;
    background:linear-gradient(180deg, rgba(0,0,0,0.15), transparent);
    border-top:6px solid #6b5136;
  }
  .item-card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    position:relative;
    box-shadow:0 6px 0 #7a5c3a, 0 8px 14px rgba(0,0,0,0.4);
    transition:transform .12s;
  }
  .item-card:hover{ transform:translateY(-4px); }
  .item-icon{
    font-size:38px; text-align:center; margin-bottom:6px;
    filter:drop-shadow(1px 2px 0 rgba(0,0,0,0.2));
  }
  .item-name{
    font-family:'Cinzel', serif; font-size:15px; font-weight:700;
    text-align:center; margin-bottom:6px; min-height:38px;
  }
  .item-price{
    font-family:'Space Mono', monospace;
    background:var(--brass);
    color:var(--ink);
    border-radius:6px;
    text-align:center;
    padding:4px 0;
    font-weight:700;
    font-size:14px;
  }
  .item-card.sold-out{ opacity:0.4; cursor:not-allowed; }
  .item-card.sold-out::after{
    content:"售完"; position:absolute; top:8px; right:8px;
    background:var(--ember); color:#fff; font-size:11px;
    padding:2px 6px; border-radius:4px; font-family:'Cinzel',serif;
  }

  /* ---------- 商人對話視窗 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .dialogue-box{
    width:min(760px, 94vw);
    margin-bottom:24px;
    background:var(--parchment);
    color:var(--ink);
    border:4px solid var(--brass);
    border-radius:14px;
    display:flex;
    gap:18px;
    padding:20px;
    box-shadow:0 -6px 30px rgba(0,0,0,0.5);
    animation:riseUp .25s ease-out;
  }
  @keyframes riseUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .portrait{
    flex:0 0 90px; height:90px; border-radius:50%;
    background:var(--leather);
    display:flex; align-items:center; justify-content:center;
    font-size:46px; border:3px solid var(--brass);
  }
  .dialogue-content{ flex:1; min-width:0; }
  .merchant-name{
    font-family:'Cinzel', serif; font-weight:700; color:var(--ember);
    font-size:15px; margin-bottom:4px;
  }
  .dialogue-text{
    font-size:16px; line-height:1.55; min-height:64px;
  }
  .dialogue-text .cursor{ animation:blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .dialogue-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; gap:10px; flex-wrap:wrap;
  }
  .price-tag{
    font-family:'Space Mono', monospace; font-weight:700;
    background:var(--brass); padding:5px 12px; border-radius:6px;
  }
  .btn{
    font-family:'Cinzel', serif; border:none; border-radius:7px;
    padding:9px 18px; cursor:pointer; font-size:14px; font-weight:700;
    transition:transform .1s;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-buy{ background:var(--moss); color:#fff; }
  .btn-buy:disabled{ background:#8a8a8a; cursor:not-allowed; }
  .btn-leave{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .continue-hint{
    font-size:12px; opacity:0.6; text-align:right; margin-top:6px;
  }

  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:var(--moss); color:#fff; padding:10px 20px;
    border-radius:8px; font-family:'Cinzel',serif; font-size:14px;
    opacity:0; transition:opacity .3s; z-index:99;
  }
  .toast.show{ opacity:1; }

  .config-note{
    padding:14px 28px; font-size:12px; opacity:0.55; font-family:'Space Mono',monospace;
  }
</style>
</head>
<body>

  <div class="shop-header">
    <div>
      <div class="shop-title">⚔️ 流浪商人的貨攤</div>
      <div class="shop-sub">「稀奇玩意兒，全宇宙都找不到第二家。」</div>
    </div>
    <div class="gold-counter">🪙 <span id="goldCount">1000</span> 金幣</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="shelf" id="shelf"></div>
  <div class="config-note" id="dataSourceNote">目前顯示示範資料。要接上你的 Google 試算表，請看檔案內註解或問我怎麼設定。</div>

  <div class="overlay" id="overlay">
    <div class="dialogue-box">
      <div class="portrait" id="portrait">🧙</div>
      <div class="dialogue-content">
        <div class="merchant-name">勞倫</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="dialogue-footer">
          <div class="price-tag" id="modalPrice">🪙 0</div>
          <div>
            <button class="btn btn-leave" id="btnLeave">先看看別的</button>
            <button class="btn btn-buy" id="btnBuy">買下它</button>
          </div>
        </div>
        <div class="continue-hint">點擊對話框可跳過打字動畫</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================================
   如何接上你自己的 Google 試算表（把下面 USE_GOOGLE_SHEET 改成 true）：
   1. 在 Google 試算表建立欄位（第一列為標題，順序不拘）：
      分類 | 商品名稱 | 介紹 | 價格 | 圖示 | 對話
      - 圖示：可放 emoji（例如 🗡️），或圖片網址
      - 對話：商人說的話，多句用「|」分隔，例如：
        這把劍可不是路邊隨便撿的。|拿去吧，用得好別回來找我抱怨。
   2. 檔案 → 共用 → 發布到網路 → 選擇「逗號分隔值 (.csv)」→ 發布
   3. 複製那個網址，貼到下面 SHEET_CSV_URL
   4. 把 USE_GOOGLE_SHEET 設為 true
   ========================================================================= */
const USE_GOOGLE_SHEET = true;
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThBXlHiQIxO-JFM26kTLh-bLpd0NkwxAi4bO1Ew_tMTQO7llLZ4Xz6xOX_R3v1J6KGM9csYsQ-PNI5/pub?output=csv";

const DEMO_DATA = [
  {category:"武器", name:"銹蝕短劍", desc:"看起來普通，但握起來莫名心安。", price:15, icon:"🗡️",
   dialogue:["這把劍陪我走過三個王國，現在輪到你了。","小心保養，它認得主人的手。"]},
  {category:"武器", name:"獵人長弓", desc:"射程遠，上手需要點練習。", price:40, icon:"🏹",
   dialogue:["森林裡的獵人都用這種弓。","箭要自己買，我這裡只賣弓喔。"]},
  {category:"藥水", name:"治療藥水", desc:"喝下去傷口會慢慢癒合，味道有點苦。", price:10, icon:"🧪",
   dialogue:["別看它小小一瓶，關鍵時刻能救命。","過期前記得用掉，別問我怎麼知道的。"]},
  {category:"藥水", name:"迷霧藥劑", desc:"喝下後短時間隱形，適合偷偷溜走。", price:25, icon:"🌫️",
   dialogue:["這是我用三種夜行花蒸餾出來的。","用完別怪我沒提醒你——味道真的很怪。"]},
  {category:"裝備", name:"皮革護甲", desc:"輕便耐用，適合長途旅行。", price:35, icon:"🛡️",
   dialogue:["穿上它，至少能擋住第一擊。","量身訂做？抱歉，我只有這一件了。"]},
  {category:"裝備", name:"旅人斗篷", desc:"擋風擋雨，還帶點神秘感。", price:20, icon:"🧥",
   dialogue:["夜裡穿上它,連月光都會繞過你。"]},
  {category:"雜貨", name:"發光苔蘚", desc:"洞穴探險必備的天然照明。", price:5, icon:"🍃",
   dialogue:["山洞裡採來的，不用火柴也能照亮路。"]},
  {category:"雜貨", name:"神秘地圖", desc:"畫得潦草,但據說標出了寶藏位置。", price:50, icon:"🗺️",
   dialogue:["這張圖是我用一頭羊換來的。","找到寶藏别忘了回來跟我分紅，哈！"]}
];

let PRODUCTS = [];
let currentCategory = "全部";
let gold = 100;
let activeProduct = null;
let typingTimer = null;

function normalizeRows(rows){
  return rows.map(r => ({
    category: (r["分類"]||"未分類").trim(),
    name: (r["商品名稱"]||"未命名商品").trim(),
    desc: (r["介紹"]||"").trim(),
    price: parseInt(r["價格"]) || 0,
    icon: (r["圖示"]||"📦").trim(),
    dialogue: (r["對話"]||"這東西不錯,你要不要看看?").split("|").map(s=>s.trim())
  }));
}

async function loadProducts(){
  if(USE_GOOGLE_SHEET && SHEET_CSV_URL && !SHEET_CSV_URL.startsWith("貼上")){
    try{
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
      PRODUCTS = normalizeRows(parsed.data);
      document.getElementById("dataSourceNote").textContent = "資料來源：你的 Google 試算表 ✅";
    }catch(e){
      console.error("讀取 Google 試算表失敗，改用示範資料", e);
      PRODUCTS = DEMO_DATA;
    }
  } else {
    PRODUCTS = DEMO_DATA;
  }
  buildTabs();
  renderShelf();
}

function buildTabs(){
  const cats = ["全部", ...new Set(PRODUCTS.map(p=>p.category))];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  cats.forEach(cat=>{
    const tab = document.createElement("div");
    tab.className = "tab" + (cat===currentCategory ? " active" : "");
    tab.textContent = cat;
    tab.onclick = ()=>{ currentCategory = cat; buildTabs(); renderShelf(); };
    tabsEl.appendChild(tab);
  });
}

function renderShelf(){
  const shelf = document.getElementById("shelf");
  shelf.innerHTML = "";
  const list = currentCategory==="全部" ? PRODUCTS : PRODUCTS.filter(p=>p.category===currentCategory);
  list.forEach(p=>{
    const card = document.createElement("div");
    card.className = "item-card" + (p.sold ? " sold-out" : "");
    card.innerHTML = `
      <div class="item-icon">${p.icon}</div>
      <div class="item-name">${p.name}</div>
      <div class="item-price">🪙 ${p.price}</div>
    `;
    if(!p.sold) card.onclick = ()=>openDialogue(p);
    shelf.appendChild(card);
  });
}

function openDialogue(product){
  activeProduct = product;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("modalPrice").textContent = `🪙 ${product.price}`;
  document.getElementById("btnBuy").disabled = gold < product.price;
  const fullLine = (product.desc ? product.desc + "　" : "") + product.dialogue[0];
  typeText(fullLine);
}

function typeText(text){
  clearInterval(typingTimer);
  const el = document.getElementById("dialogueText");
  el.innerHTML = "";
  let i = 0;
  typingTimer = setInterval(()=>{
    el.textContent = text.slice(0, i+1);
    i++;
    if(i >= text.length){ clearInterval(typingTimer); }
  }, 22);
}

document.getElementById("dialogueText").onclick = function(){
  clearInterval(typingTimer);
};

document.getElementById("btnLeave").onclick = ()=>{
  document.getElementById("overlay").classList.remove("show");
  activeProduct = null;
};

document.getElementById("btnBuy").onclick = ()=>{
  if(!activeProduct || gold < activeProduct.price) return;
  gold -= activeProduct.price;
  document.getElementById("goldCount").textContent = gold;
  activeProduct.sold = true;
  const farewell = activeProduct.dialogue[1] || "謝謝惠顧,一路順風!";
  typeText(farewell);
  showToast(`你買下了「${activeProduct.name}」`);
  document.getElementById("btnBuy").disabled = true;
  renderShelf();
};

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

loadProducts();
</script>
</body>
</html>
